---
- name: Instalar File Browser
  hosts: localhost
  connection: local
  become: yes
  vars:
    # Credenciais do administrador de File Browser
    filebrowser_admin_user: "admin"
    filebrowser_admin_pass: "changeme"
    # Axustes opcionais
    filebrowser_version: "v2.63.18"
    filebrowser_port: 8080
    # Subruta pública: File Browser segue a escoitar no 8080, pero Apache (porto
    # 80) reenvíalle todo o que colgue de {{ filebrowser_baseurl }}, así o
    # alumnado entra nun http://<servidor>/arquivos en vez de aprender un
    # http://<servidor>:8080. Ten que coincidir co --baseurl do propio File
    # Browser: sen el, os enlaces absolutos que xera (/static, /api) sairían da
    # subruta e a interface non cargaría detrás do proxy.
    filebrowser_baseurl: "/arquivos"
    filebrowser_root: "/var/www/html/arquivos"
    # Usuario do sistema que executa Piztu (app.py/main.py). Se se indica, engádese
    # ao grupo www-data para que poida LER o cartafol compartido que crea File
    # Browser (dixitalizacion/, permisos 750 www-data:www-data) — necesario para
    # que o mapa da aula mostre quen está a usar Tao en cada equipo.
    # Baleiro = non tocar grupos (o profesor pode engadilo á man máis tarde).
    piztu_os_user: ""

  tasks:
    # Require un servidor web xa activo en /var/www/html (instalado por este
    # instalador no paso "LAMP" ou previamente por outra vía) e o usuario/grupo
    # www-data, que xa ven de fábrica en calquera Debian.
    - name: 1. Descargar o binario de File Browser
      get_url:
        url: "https://github.com/filebrowser/filebrowser/releases/download/{{ filebrowser_version }}/linux-amd64-filebrowser.tar.gz"
        dest: /tmp/filebrowser.tar.gz
        mode: '0644'

    - name: 2. Deter o servizo filebrowser se xa existía (para reconfigurar sen conflitos)
      command: systemctl stop filebrowser
      ignore_errors: yes
      changed_when: false

    - name: 3. Extraer o binario filebrowser en /usr/local/bin
      command: tar -xzf /tmp/filebrowser.tar.gz -C /usr/local/bin/ filebrowser
      changed_when: true

    - name: 4. Eliminar o arquivo tar.gz temporal
      file:
        path: /tmp/filebrowser.tar.gz
        state: absent

    - name: 5. Facer executable o binario filebrowser
      file:
        path: /usr/local/bin/filebrowser
        mode: '0755'

    - name: 6. Purgar a base de datos anterior de File Browser
      file:
        path: /etc/filebrowser/filebrowser.db
        state: absent

    - name: 7. Crear os directorios necesarios
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/filebrowser
        - "{{ filebrowser_root }}"

    - name: 8. Inicializar a base de datos de File Browser
      command: /usr/local/bin/filebrowser config init --database=/etc/filebrowser/filebrowser.db
      changed_when: true

    - name: 9. Configurar enderezo, porto, raíz e log de File Browser
      command: >
        /usr/local/bin/filebrowser config set --database=/etc/filebrowser/filebrowser.db
        --address=0.0.0.0 --port={{ filebrowser_port }}
        --baseurl={{ filebrowser_baseurl }}
        --root={{ filebrowser_root }} --log=/var/log/filebrowser.log
      changed_when: true

    - name: 10. Crear o usuario administrador de File Browser
      command: >
        /usr/local/bin/filebrowser users add {{ filebrowser_admin_user }} '{{ filebrowser_admin_pass }}'
        --perm.admin=true --database=/etc/filebrowser/filebrowser.db
      no_log: true
      changed_when: true

    - name: 11. Crear un ficheiro de proba inicial
      copy:
        content: "Benvido a File Browser.\n"
        dest: "{{ filebrowser_root }}/leame.txt"

    - name: 12. Asignar a propiedade a www-data
      file:
        path: "{{ item }}"
        owner: www-data
        group: www-data
        recurse: yes
      loop:
        - "{{ filebrowser_root }}"
        - /etc/filebrowser

    - name: 13. Crear o servizo systemd para File Browser
      copy:
        dest: /etc/systemd/system/filebrowser.service
        content: |
          [Unit]
          Description=File Browser
          After=network.target

          [Service]
          User=www-data
          Group=www-data
          ExecStart=/usr/local/bin/filebrowser --database=/etc/filebrowser/filebrowser.db
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: 14. Activar e (re)arrincar o servizo File Browser
      systemd:
        name: filebrowser
        daemon_reload: yes
        enabled: yes
        state: restarted

    # ── Porto 80: Apache como proxy inverso ──────────────────────────────────
    # File Browser segue no 8080 (sen privilexios, como www-data), e é Apache
    # quen publica {{ filebrowser_baseurl }} no porto 80. Así o alumnado escribe
    # http://<servidor>{{ filebrowser_baseurl }} e o servidor web do alumnado
    # (/var/www/html) segue intacto na raíz. Se non hai Apache neste servidor
    # sáltase todo o bloque: File Browser queda accesible no 8080 coma sempre,
    # iso si, xa baixo a subruta {{ filebrowser_baseurl }}.
    - name: 14b. Comprobar se hai Apache neste servidor
      stat:
        path: /usr/sbin/apache2
      register: apache_bin

    - name: 14c. Activar os módulos de proxy de Apache
      # proxy_wstunnel é para a consola/eventos de File Browser, que usan
      # websockets: sen el o proxy devolve 500 nesa ruta.
      command: a2enmod proxy proxy_http proxy_wstunnel
      when: apache_bin.stat.exists
      register: apache_modulos
      changed_when: "'Enabling' in apache_modulos.stdout"

    - name: 14d. Escribir a configuración de proxy de Apache para File Browser
      copy:
        dest: /etc/apache2/conf-available/piztu-filebrowser.conf
        content: |
          # Xerado por Piztu (playbooks/instalar_filebrowser.yaml). Non editar a man:
          # sobrescríbese en cada instalación de File Browser.
          <IfModule mod_proxy.c>
            ProxyPreserveHost On
            # O websocket vai primeiro: a primeira regra que casa gaña.
            ProxyPass {{ filebrowser_baseurl }}/api/command ws://127.0.0.1:{{ filebrowser_port }}{{ filebrowser_baseurl }}/api/command
            ProxyPass {{ filebrowser_baseurl }} http://127.0.0.1:{{ filebrowser_port }}{{ filebrowser_baseurl }}
            ProxyPassReverse {{ filebrowser_baseurl }} http://127.0.0.1:{{ filebrowser_port }}{{ filebrowser_baseurl }}
          </IfModule>
      when: apache_bin.stat.exists

    - name: 14e. Activar a configuración e recargar Apache
      shell: a2enconf piztu-filebrowser && systemctl reload apache2
      when: apache_bin.stat.exists
      changed_when: true

    - name: 15. Engadir o usuario de Piztu ao grupo www-data (lectura de sesións de Tao)
      user:
        name: "{{ piztu_os_user }}"
        groups: www-data
        append: yes
      when: piztu_os_user is defined and piztu_os_user | length > 0
      register: piztu_grupo_www_data

    - name: Finalizado
      debug:
        msg: >
          File Browser instalado en
          {% if apache_bin.stat.exists %}http://{{ ansible_fqdn | default(inventory_hostname) }}{{ filebrowser_baseurl }} (porto 80, vía Apache){% else %}http://localhost:{{ filebrowser_port }}{{ filebrowser_baseurl }}{% endif %}
          (usuario: {{ filebrowser_admin_user }}).
          {% if piztu_grupo_www_data is defined and piztu_grupo_www_data is changed %}
          IMPORTANTE: "{{ piztu_os_user }}" engadiuse ao grupo www-data; pecha sesión
          e volve entrar (ou reinicia) para que Piztu poida ler as sesións de Tao.
          {% endif %}
