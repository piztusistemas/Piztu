# ansible.cfg — Configuración de Ansible para Piztu
#
# Evita o prompt de verificación de host key de SSH
#   ("The authenticity of host '...' can't be established. … (yes/no)?")
# para poder controlar a aula desde calquera servidor sen intervención manual.
#
# Ansible le este ficheiro cando se executa desde o directorio do proxecto
# (base_dir, normalmente /opt/piztu), así que afecta á web, ao monitor de ruído
# e aos comandos ansible-playbook manuais por igual.

[defaults]
# Non bloquear cando a clave do equipo aínda non está en known_hosts.
host_key_checking = False
# Inventario por defecto: permite executar "ansible-playbook playbooks/x.yaml"
# sen ter que escribir "-i hosts".
inventory = hosts

[ssh_connection]
ssh_args = -o ConnectTimeout=10
# Acelera a execución reutilizando a conexión SSH.
pipelining = True
